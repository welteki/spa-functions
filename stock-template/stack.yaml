version: 1.0
provider:
  name: openfaas
  gateway: http://127.0.0.1:8080
functions:
  web-spa-stock:
    lang: golang-middleware
    handler: ./web-spa
    image: ${OPENFAAS_PREFIX:-ghcr.io/your-name}/web-spa-stock:${TAG:-latest}
    environment:
      STORE: memory
    # secrets:
    #   - todo-db-url
configuration:
  copy:
    - static
  templates:
    - name: golang-middleware
      source: https://github.com/openfaas/golang-http-template#0.9.1
