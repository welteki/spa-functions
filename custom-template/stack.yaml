version: 1.0
provider:
  name: openfaas
  gateway: http://127.0.0.1:8080
functions:
  todo:
    lang: dockerfile
    handler: ./todo
    image: ${REGISTRY:-ttl.sh}/${OWNER:-openfaas-function}/todo:${TAG:-latest}
    build_args:
      # Default matches the gateway mount path so a plain build is deploy-ready.
      VITE_BASE_PATH: ${VITE_BASE_PATH:-/function/todo}
    environment:
      STORE: memory
      VERSION: ${VERSION:-dev}
    # secrets:
    #   - todo-db-url
